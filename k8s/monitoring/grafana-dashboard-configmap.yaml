apiVersion: v1
kind: ConfigMap
metadata:
  name: mern-monitoring-dashboard
  namespace: eventora
  labels:
    grafana_dashboard: "1"
data:
  mern-dashboard.json: |
    {
      "title": "MERN Stack Application Metrics",
      "tags": ["mern", "nodejs"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 0,
      "refresh": "5s",
      "panels": [
        {
          "title": "API HTTP Requests / sec",
          "type": "graph",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "rate(http_requests_total{app=\"api\"}[1m])",
              "legendFormat": "{{method}} {{route}}"
            }
          ]
        },
        {
          "title": "API Memory Usage (Heap)",
          "type": "graph",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "nodejs_heap_space_size_used_bytes{app=\"api\"}",
              "legendFormat": "Used Heap"
            }
          ]
        },
        {
          "title": "API Process CPU Usage",
          "type": "gauge",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{app=\"api\"}[1m])",
              "legendFormat": "CPU Usage"
            }
          ]
        },
        {
          "title": "API Logs (Loki)",
          "type": "logs",
          "datasource": "Loki",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "{app=\"api\"}"
            }
          ]
        }
      ]
    }
